<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="ably-channel" content="%VITE_ABLY_CHANNEL_NAME%" />
    <title>App</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        background: #f9f9f9;
        color: #1a1a1a;
      }

      h1 {
        color: #ff5416;
        margin-top: 0;
      }

      #controls {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      button {
        background: #ff5416;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
      }

      button:hover {
        background: #e04010;
      }

      /* ── Two-column layout ── */
      #columns {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 1rem;
        align-items: start;
      }

      .panel {
        background: #1a1a1a;
        border-radius: 8px;
        overflow: hidden;
      }

      .panel-header {
        padding: 0.6rem 1rem;
        background: #222;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .panel-header .count {
        background: #ff5416;
        color: white;
        border-radius: 99px;
        padding: 0.1rem 0.5rem;
        font-size: 0.7rem;
      }

      /* ── Message log (left) ── */
      #log {
        color: #f0f0f0;
        padding: 1rem;
        min-height: 300px;
        max-height: 500px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 0.85rem;
      }

      #log .entry {
        padding: 0.25rem 0;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        gap: 0.75rem;
      }

      #log .entry:last-child {
        border-bottom: none;
      }
      #log .time {
        color: #555;
        white-space: nowrap;
      }
      #log .type-message {
        color: #7ecfff;
      }
      #log .type-occupancy {
        color: #a8e6a3;
      }
      #log .type-system {
        color: #ffd27e;
      }
      #log .empty {
        color: #555;
        font-style: italic;
      }

      /* ── Client list (right) ── */
      #client-list {
        padding: 0.5rem 0;
        min-height: 300px;
        max-height: 500px;
        overflow-y: auto;
      }

      .client-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid #2a2a2a;
        font-family: monospace;
        font-size: 0.8rem;
        color: #f0f0f0;
      }

      .client-item:last-child {
        border-bottom: none;
      }

      .client-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #a8e6a3;
        flex-shrink: 0;
      }

      .client-empty {
        padding: 1rem;
        color: #555;
        font-style: italic;
        font-size: 0.85rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Ably Channel Monitor</h1>

    <div id="controls">
      <button onclick="triggerMockConnections()">Mock Connections</button>
      <button onclick="clearLog()">Clear</button>
    </div>

    <div id="columns">
      <!-- Left: message log -->
      <div class="panel">
        <div class="panel-header">Messages</div>
        <div id="log">
          <div class="entry empty">Waiting for messages...</div>
        </div>
      </div>

      <!-- Right: connected clients -->
      <div class="panel">
        <div class="panel-header">
          Connected Clients
          <span class="count" id="client-count">0</span>
        </div>
        <div id="client-list">
          <div class="client-empty">No clients yet</div>
        </div>
      </div>
    </div>

    <script type="module" src="/debug.js"></script>
    <script type="module" src="/app.js"></script>

    <script>
      function triggerMockConnections() {
        fetch("/api/mock-connections")
          .then((r) => r.json())
          .then((d) =>
            window.__logToScreen(
              "system",
              `Triggered ${d.connections} mock connections`,
            ),
          )
          .catch((e) => window.__logToScreen("system", `Error: ${e.message}`));
      }

      function clearLog() {
        const log = document.getElementById("log");
        log.innerHTML =
          '<div class="entry empty">Waiting for messages...</div>';
      }

      // Append a message to the log panel
      window.__logToScreen = function (type, text) {
        const log = document.getElementById("log");
        const empty = log.querySelector(".empty");
        if (empty) empty.remove();

        const time = new Date().toLocaleTimeString();
        const entry = document.createElement("div");
        entry.className = "entry";
        entry.innerHTML = `<span class="time">${time}</span><span class="type-${type}">${text}</span>`;
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
      };

      // Replace the entire client list with the provided array of clientIds
      window.__updateClientList = function (clientIds) {
        const list = document.getElementById("client-list");
        const count = document.getElementById("client-count");

        count.textContent = clientIds.length;

        if (clientIds.length === 0) {
          list.innerHTML = '<div class="client-empty">No clients yet</div>';
          return;
        }

        list.innerHTML = clientIds
          .map(
            (id) => `
          <div class="client-item">
            <span class="client-dot"></span>
            <span>${id}</span>
          </div>
        `,
          )
          .join("");
      };
    </script>
  </body>
</html>
