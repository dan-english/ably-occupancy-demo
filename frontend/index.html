<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="ably-channel" content="%VITE_ABLY_CHANNEL_NAME%" />
    <link rel="stylesheet" href="/styles.css" />
    <title>App</title>
  </head>
  <body>
    <h1>Ably Occupancy Channel Monitor</h1>

    <div id="controls">
      <button onclick="triggerMockConnections()">Mock Connections</button>
      <button onclick="clearLog()">Clear</button>
    </div>

    <div id="columns">
      <!-- Left: message log -->
      <div class="panel">
        <div class="panel-header">Messages</div>
        <div id="log">
          <div class="entry empty">Waiting for messages...</div>
        </div>
      </div>

      <!-- Right: connected clients -->
      <div class="panel">
        <div class="panel-header">
          Connected Clients
          <span class="count" id="client-count">0</span>
        </div>
        <div id="client-list">
          <div class="client-empty">No clients yet</div>
        </div>
      </div>
    </div>

    <script type="module" src="/debug.js"></script>
    <script type="module" src="/app.js"></script>

    <script>
      function triggerMockConnections() {
        fetch("/api/mock-connections")
          .then((r) => r.json())
          .then((d) =>
            window.__logToScreen(
              "system",
              `Triggered ${d.connections} mock connections`,
            ),
          )
          .catch((e) => window.__logToScreen("system", `Error: ${e.message}`));
      }

      function clearLog() {
        const log = document.getElementById("log");
        log.innerHTML =
          '<div class="entry empty">Waiting for messages...</div>';
      }

      // Append a message to the log panel
      window.__logToScreen = function (type, text) {
        const log = document.getElementById("log");
        const empty = log.querySelector(".empty");
        if (empty) empty.remove();

        const time = new Date().toLocaleTimeString();
        const entry = document.createElement("div");
        entry.className = "entry";
        entry.innerHTML = `<span class="time">${time}</span><span class="type-${type}">${text}</span>`;
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
      };

      // Replace the entire client list with the provided array of clientIds
      window.__updateClientList = function (clientIds) {
        const list = document.getElementById("client-list");
        const count = document.getElementById("client-count");

        count.textContent = clientIds.length;

        if (clientIds.length === 0) {
          list.innerHTML = '<div class="client-empty">No clients yet</div>';
          return;
        }

        list.innerHTML = clientIds
          .map(
            (id) => `
          <div class="client-item">
            <span class="client-dot"></span>
            <span>${id}</span>
          </div>
        `,
          )
          .join("");
      };
    </script>
  </body>
</html>
